name: npm test
run-name: npm test @ ${{ github.ref_name }}

# T-299（EC 帳本）：cellscape 的最小 pool 測試 workflow。
# 只跑隨包零依賴的 scripts/test.cjs（Atlas 11＋Loop 7＋模型契約 9＋觀察邊界 4）；
# 不安裝 npm 依賴、不做瀏覽器驗收、不算完整產品驗證。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-test:
    runs-on: [self-hosted, Windows, X64, ci-box]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # runner 使用者 PATH 無 node（首次跑動 34481588319 實測）；
      # 以 setup-node 裝在 runner tool cache，釘 22.x 對齊 FINAL-REVIEW 的 22.16 基線，不動系統。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show node version
        shell: cmd
        run: node --version

      - name: node scripts/test.cjs
        shell: cmd
        run: node scripts\test.cjs
